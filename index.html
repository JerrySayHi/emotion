<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人长文阅读页面">
  <title>在这里填写文章标题</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --paper: #fffefa;
      --ink: #292b26;
      --muted: #85877f;
      --line: #e9e6de;
      --accent: #718371;
      --width: 780px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.95; -webkit-font-smoothing: antialiased;
    }
    .topbar {
      max-width: 1120px; height: 58px; margin: auto; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--muted); font-size: 11px; letter-spacing: .16em;
    }
    .brand { color: var(--ink); font-weight: 700; }
    .page { max-width: var(--width); margin: 34px auto 80px; padding: 0 22px; }
    .paper {
      background: var(--paper); padding: 66px 76px 70px;
      border: 1px solid rgba(60,60,50,.05);
      box-shadow: 0 18px 60px rgba(44,42,34,.055);
    }
    .eyebrow {
      color: var(--accent); font-size: 11px; font-weight: 700;
      letter-spacing: .22em; margin-bottom: 22px;
    }
    h1 {
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(30px, 5vw, 43px); line-height: 1.4;
      font-weight: 600; letter-spacing: .015em; margin: 0 0 24px;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 22px;
      color: var(--muted); font-size: 12px;
      padding-bottom: 27px; border-bottom: 1px solid var(--line);
    }
    .intro {
      margin: 30px 0 38px; padding: 18px 21px;
      background: #f0f2ed; border-left: 3px solid var(--accent);
      color: #62695e; font-size: 14px; line-height: 1.85;
    }
    article { font-size: 15px; color: #373932; overflow-wrap: anywhere; }
    article p { margin: 0 0 19px; text-align: justify; text-indent: 2em; }
    article h2, article h3 {
      font-family: Georgia, "Songti SC", "SimSun", serif;
      color: #30372f; line-height: 1.55; margin: 34px 0 14px;
    }
    article h2 { font-size: 23px; }
    article h3 { font-size: 18px; }
    article blockquote {
      margin: 26px 0; padding: 4px 0 4px 20px;
      border-left: 2px solid #aab6a7; color: #70766c;
    }
    .writing-area {
      min-height: 900px;
      color: #3b3d37;
    }
    .writing-area .hint {
      color: #a1a399; background: #f8f8f4;
      border: 1px dashed #d8dbd1; border-radius: 4px;
      padding: 18px 20px; text-indent: 0; font-size: 13px;
    }
    .endmark { text-align: center; color: #9ba092; letter-spacing: .45em; margin: 52px 0 28px; }
    .footer {
      border-top: 1px solid var(--line); padding-top: 22px; margin-top: 48px;
      color: var(--muted); font-size: 12px; text-align: center;
      letter-spacing: .08em;
    }
    .progress {
      position: fixed; top: 0; left: 0; height: 2px; width: 0;
      background: var(--accent); z-index: 10;
    }
    .backtop {
      position: fixed; right: 22px; bottom: 22px; width: 40px; height: 40px;
      border: 1px solid var(--line); border-radius: 50%;
      background: var(--paper); color: var(--accent); cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,.06); font-size: 17px;
    }
    @media (max-width: 640px) {
      .topbar { padding: 0 18px; height: 52px; }
      .page { margin: 12px auto 35px; padding: 0 10px; }
      .paper { padding: 40px 24px 48px; }
      h1 { font-size: 30px; }
      article { font-size: 14px; line-height: 1.95; }
      article h2 { font-size: 21px; }
      .backtop { right: 12px; bottom: 12px; }
    }
    @media print {
      body { background: white; }
      .topbar, .progress, .backtop { display: none; }
      .page { max-width: none; margin: 0; padding: 0; }
      .paper { border: 0; box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="topbar">
    <div class="brand">PERSONAL NOTES</div>
    <div>WORDS & THOUGHTS</div>
  </header>

  <main class="page">
    <div class="paper">
      <div class="eyebrow">ESSAY · LONG READ</div>
      <h1>你的论文标题</h1>
      <div class="meta">
        <span>作者：石锐杰</span>
        <span>日期：2026 年 月 日</span>
      </div>

      <div class="intro">
        在这里填写一段简短的导语或摘要（可选）。如果不需要，可以直接删除这一块。
      </div>

      <article class="writing-area">
        <!-- 将下面的提示段落替换成你的论文正文。每个自然段使用一个 <p>...</p> 包起来即可。 -->
        <p class="hint">正文从这里开始。请将你的约 4000 字论文粘贴或替换到这里。无需按照固定章节拆分，直接按你的原文段落顺序填入即可。<br><br>如果需要分段，每一段使用单独的段落标签：<br>&lt;p&gt;这里是一段正文。&lt;/p&gt;<br>&lt;p&gt;这里是下一段正文。&lt;/p&gt;</p>
      </article>

      <div class="endmark">✳ ✳ ✳</div>
      <div class="footer">感谢阅读 · THANK YOU FOR READING</div>
    </div>
  </main>

  <button class="backtop" aria-label="返回顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script>
    const progress = document.getElementById('progress');
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? window.scrollY / max * 100 : 0) + '%';
    });
  </script>
</body>
</html>
